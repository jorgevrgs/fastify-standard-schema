pre-commit:
  jobs:
    - name: oxfmt
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc}'
      exclude:
        - dist/**
        - node_modules/**
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: '*.{js,ts,cjs,mjs,jsx,tsx}'
      exclude:
        - dist/**
        - node_modules/**
      run: pnpm exec oxlint {staged_files}

    - name: typecheck
      run: pnpm check

pre-push:
  jobs:
    - name: test
      run: pnpm test
