name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: |
          pnpm format:check
          pnpm lint
          pnpm check
          pnpm test

      - name: Run performance benchmarks
        run: pnpm benchmark

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.event.release.tag_name || github.sha }}
          path: |
            benchmarks/RESULTS.md
            benchmarks/reports/

      - name: Publish package
        run: npm publish --access public
